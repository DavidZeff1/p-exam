<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('exam-p-theme'); } catch {}
        if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>:root[data-theme="dark"] { background: #101b27; color-scheme: dark; }</style>
    <title>SOA Exam P Study Guide</title>
    <meta name="description" content="Study the May 2026 Exam P syllabus with complete probability lessons, chapter practice, worked solutions, and a timed 30-question practice exam." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1a2e'/><text x='16' y='23' font-size='18' font-family='serif' font-style='italic' fill='%234a90d9' text-anchor='middle'>P</text></svg>"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/scripts/main.jsx"></script>
  </body>
</html>
